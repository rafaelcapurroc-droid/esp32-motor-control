<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 - Monitoreo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:#f0f2f5;color:#333;padding:16px}
.container{max-width:900px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:14px;flex-shrink:0;flex-wrap:wrap;gap:10px}
h2{margin:0;font-size:1.1rem;color:#444}
.status{font-weight:700;font-size:.85rem}
.connected{color:#28a745}
.disconnected{color:#dc3545}
.link-control{background:#007bff;color:#fff;padding:7px 16px;border-radius:6px;text-decoration:none;font-size:.85rem;font-weight:600}
.link-control:hover{background:#0056b3}
.metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:14px;flex-shrink:0}
.metric-card{background:#fff;padding:14px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);text-align:center}
.metric-label{font-size:.72rem;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.metric-value{font-size:1.7rem;font-weight:700;line-height:1.2}
.unit{font-size:.85rem;color:#999;font-weight:400}
.text-cyan{color:#17a2b8}
.text-amber{color:#fd7e14}
.text-purple{color:#6f42c1}
.history-panel{background:#fff;padding:18px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);flex:1;overflow:hidden;display:flex;flex-direction:column}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.history-header h3{font-size:1rem;color:#444}
.btn-action{padding:6px 12px;font-size:.85rem;border:none;border-radius:4px;cursor:pointer;font-weight:600;margin-left:8px}
.btn-clear{background:#e2e6ea;color:#444}
.btn-csv{background:#28a745;color:#fff}
.btn-csv-raw{background:#6f42c1;color:#fff}
.table-container{flex:1;overflow-y:auto;border:1px solid #eee;border-radius:6px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{background:#f8f9fa;color:#666;font-weight:600;text-transform:uppercase;font-size:.75rem;letter-spacing:1px;padding:12px;text-align:left;position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid #eee;color:#333}
tr:last-child td{border-bottom:none}
tr:hover{background-color:#f8f9fa}
.empty-msg{text-align:center;padding:20px;color:#999;font-style:italic}
.raw-info{font-size:.78rem;color:#888;margin-right:auto}
.overflow-warning{font-size:.78rem;color:#dc3545;font-weight:600;display:none}
</style>
</head>
<body>
<div class="container">
  <header>
    <h2>ESP32 - Monitoreo</h2>
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div id="status" class="status disconnected">Desconectado</div>
      <a href="/index.html" class="link-control">Control</a>
    </div>
  </header>

  <div class="metrics-grid">
    <div class="metric-card">
      <div class="metric-label">Objetivo</div>
      <div class="metric-value text-cyan"><span id="mTarget">0.000</span> <span class="unit">m/s</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Real</div>
      <div class="metric-value text-cyan"><span id="mActual">0.000</span> <span class="unit">m/s</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Corriente</div>
      <div class="metric-value text-amber"><span id="mCur">0.00</span> <span class="unit">A</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">PWM</div>
      <div class="metric-value"><span id="mPwm">0</span> <span class="unit">/1023</span></div>
    </div>
    <div class="metric-card">
      <div class="metric-label">Muestras crudas</div>
      <div class="metric-value text-purple"><span id="mPulseCount">0</span></div>
    </div>
  </div>

  <div class="history-panel">
    <div class="history-header">
      <h3>Historial Reciente</h3>
      <div>
        <button class="btn-action btn-clear" onclick="clearTable()">Limpiar</button>
        <button class="btn-action btn-csv" onclick="downloadCSV()">CSV</button>
      </div>
    </div>
    <div class="table-container">
      <table id="history-table">
        <thead>
          <tr>
            <th>Hora</th>
            <th>Objetivo</th>
            <th>Real</th>
            <th>A</th>
            <th>PWM</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" class="empty-msg">Esperando datos...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="history-header" style="margin-top:16px">
      <h3>Log crudo imán por imán</h3>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="overflow-warning" id="overflowWarning">⚠ se perdieron muestras (buffer del ESP32 lleno)</span>
        <span class="raw-info" id="rawInfo"></span>
        <button class="btn-action btn-clear" onclick="clearPulseLog()">Limpiar</button>
        <button class="btn-action btn-csv-raw" onclick="downloadPulseCSV()">CSV imán por imán</button>
      </div>
    </div>
  </div>
</div>

<script>
let ws = null;
let wsRetryTimer = null;
let historyData = [];
const MAX_HISTORY = 100;

// --- Log crudo imán por imán (sin límite de tamaño: se exporta y se limpia manualmente) ---
let pulseLog = [];
let cumulativeTimeUs = 0; // tiempo acumulado reconstruido a partir de los períodos recibidos

function wsConnect() {
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  
  if (wsRetryTimer) { clearTimeout(wsRetryTimer); wsRetryTimer = null; }

  const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${protocol}//${location.hostname}/ws`);
  
  ws.onopen = () => {
    document.getElementById('status').textContent = 'Conectado';
    document.getElementById('status').className = 'status connected';
  };
  
  ws.onmessage = (e) => {
    try {
      const d = JSON.parse(e.data);
      updateMetrics(d);
      addToHistory(d);
      if (Array.isArray(d.pulses) && d.pulses.length > 0) {
        addPulses(d.pulses);
      }
      if (d.pulses_overflow) {
        document.getElementById('overflowWarning').style.display = 'inline';
      }
    } catch (err) { console.error('JSON parse error', err); }
  };
  
  ws.onerror = () => { ws.close(); };
  
  ws.onclose = () => {
    document.getElementById('status').textContent = 'Desconectado';
    document.getElementById('status').className = 'status disconnected';
    ws = null;
    
    if (document.visibilityState === 'visible') {
        if (!wsRetryTimer) wsRetryTimer = setTimeout(wsConnect, 3000);
    }
  };
}

function updateMetrics(d) {
  if (d.sp_pending_m_s !== undefined) {
    const targetVal = parseFloat(d.sp_pending_m_s);
    document.getElementById('mTarget').textContent = targetVal.toFixed(3);
  } else if (d.sp_m_s !== undefined) {
    document.getElementById('mTarget').textContent = parseFloat(d.sp_m_s).toFixed(3);
  }

  if (d.speed_m_s !== undefined) {
    document.getElementById('mActual').textContent = parseFloat(d.speed_m_s).toFixed(3);
  }

  if (d.current !== undefined) {
    document.getElementById('mCur').textContent = (+d.current).toFixed(2);
  }

  if (d.velocity !== undefined) {
    document.getElementById('mPwm').textContent = d.velocity;
  }
}

function addToHistory(d) {
  if (d.sp_m_s === undefined && d.sp_pending_m_s === undefined) return;

  const now = new Date();
  const timeStr = now.toLocaleTimeString();

  let target = 0;
  if (d.sp_pending_m_s !== undefined) {
    target = parseFloat(d.sp_pending_m_s);
  } else if (d.sp_m_s !== undefined) {
    target = parseFloat(d.sp_m_s);
  }

  const row = {
    time:    timeStr,
    target:  target.toFixed(3),
    actual:  (+d.speed_m_s || 0).toFixed(3),
    current: (+d.current    || 0).toFixed(2),
    pwm:     d.velocity || 0
  };

  historyData.unshift(row);
  if (historyData.length > MAX_HISTORY) historyData.pop();
  
  renderTable();
}

function renderTable() {
  const tbody = document.querySelector('#history-table tbody');
  if (historyData.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" class="empty-msg">Esperando datos...</td></tr>';
    return;
  }

  let html = '';
  historyData.forEach(item => {
    html += `
      <tr>
        <td>${item.time}</td>
        <td>${item.target}</td>
        <td>${item.actual}</td>
        <td>${item.current}</td>
        <td>${item.pwm}</td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

function clearTable() {
  historyData = [];
  renderTable();
}

function downloadCSV() {
  if (historyData.length === 0) return;
  
  let csvContent = "data:text/csv;charset=utf-8,";
  csvContent += "Hora,Objetivo m/s,Real m/s,A,PWM\n";
  
  historyData.forEach(row => {
    csvContent += `${row.time},${row.target},${row.actual},${row.current},${row.pwm}\n`;
  });

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "motor_data.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// --- LOG CRUDO IMÁN POR IMÁN ---
// Cada elemento de pulseLog: { periodo_us, rpm, vel_m_s, tiempo_acumulado_ms }
// tiempo_acumulado_ms se reconstruye sumando los períodos recibidos (no hay
// timestamp absoluto del ESP32 — alcanza para graficar velocidad vs. tiempo
// relativo desde que se abrió esta página / se limpió el log).
function addPulses(pulsesArr) {
  pulsesArr.forEach(p => {
    cumulativeTimeUs += p.p; // p.p = período crudo en µs
    pulseLog.push({
      periodo_us:          p.p,
      rpm:                 p.r,
      vel_m_s:             p.v,
      tiempo_acumulado_ms: cumulativeTimeUs / 1000.0
    });
  });
  document.getElementById('mPulseCount').textContent = pulseLog.length;
  document.getElementById('rawInfo').textContent =
    pulseLog.length + ' muestra(s) acumulada(s) desde la última limpieza';
}

function clearPulseLog() {
  pulseLog = [];
  cumulativeTimeUs = 0;
  document.getElementById('mPulseCount').textContent = '0';
  document.getElementById('rawInfo').textContent = '';
  document.getElementById('overflowWarning').style.display = 'none';
}

function downloadPulseCSV() {
  if (pulseLog.length === 0) return;

  let csvContent = "data:text/csv;charset=utf-8,";
  csvContent += "Periodo_us,RPM_instantanea,Velocidad_instantanea_m_s,Tiempo_acumulado_ms\n";

  pulseLog.forEach(row => {
    csvContent += `${row.periodo_us},${row.rpm.toFixed(2)},${row.vel_m_s.toFixed(4)},${row.tiempo_acumulado_ms.toFixed(3)}\n`;
  });

  const encodedUri = encodeURI(csvContent);
  const link = document.createElement("a");
  link.setAttribute("href", encodedUri);
  link.setAttribute("download", "pulsos_iman_por_iman.csv");
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

// --- GESTIÓN DE CICLO DE VIDA ---

window.addEventListener('beforeunload', () => {
    if (ws) {
        ws.close(1000, 'navegando');
    }
});

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
        wsConnect();
    } else {
        if (ws) {
            ws.close(1000, 'oculto');
            ws = null;
        }
        if (wsRetryTimer) {
            clearTimeout(wsRetryTimer);
            wsRetryTimer = null;
        }
    }
});

window.addEventListener('load', () => {
    if (document.visibilityState === 'visible') {
        wsConnect();
    }
});
</script>
</body>
</html>
